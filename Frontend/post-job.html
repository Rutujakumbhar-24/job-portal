<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post a Job - JobPortal</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="page-banner">
<div class="container"><h2 class="mb-0">Post a New Job</h2></div>
</div>
<div class="container">
<div class="row justify-content-center">
<div class="col-lg-8">
<div class="form-card">
<div id="msg"></div>
<form id="jobForm">
<div class="row g-3">
<div class="col-md-6">
<label class="form-label">Job Title</label>
<input type="text" id="title" class="form-control" required>
</div>
<div class="col-md-6">
<label class="form-label">Company Name</label>
<input type="text" id="company" class="form-control" required>
</div>
<div class="col-md-4">
<label class="form-label">Location</label>
<input type="text" id="location" class="form-control" required>
</div>
<div class="col-md-4">
<label class="form-label">Job Type</label>
<select id="jobType" class="form-select">
<option>Full Time</option>
<option>Part Time</option>
<option>Internship</option>
<option>Remote</option>
<option>Contract</option>
</select>
</div>
<div class="col-md-4">
<label class="form-label">Salary</label>
<input type="text" id="salary" class="form-control"
placeholder="e.g. 4-6 LPA">
</div>
<div class="col-12">
<label class="form-label">Job Description</label>
<textarea id="description" rows="7" class="form-control"
required></textarea>
</div>
<div class="col-12">
<button type="submit" class="btn btn-primary">Post Job</button>
</div>
</div>
</form>
</div>
</div>
</div>
</div>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/post-job.js"></script>
</body>
</html>
