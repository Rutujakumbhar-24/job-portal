<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Jobs - JobPortal</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="page-banner">
<div class="container"><h2 class="mb-0">Find Jobs</h2></div>
</div>
<div class="container">
<!-- Filter form -->
<form id="filterForm" class="row g-2 mb-4 form-card">
<div class="col-md-4">
<input type="text" id="keyword" class="form-control"
placeholder="Title or company">
</div>
<div class="col-md-3">
<input type="text" id="location" class="form-control" placeholder="Location">
</div>
<div class="col-md-3">
<select id="jobType" class="form-select">
<option value="">All Types</option>
<option>Full Time</option>
<option>Part Time</option>
<option>Internship</option>
<option>Remote</option>
<option>Contract</option>
</select>
</div>
<div class="col-md-2 d-grid">
<button type="submit" class="btn btn-primary">Search</button>
</div>
</form>
<p id="resultCount" class="text-muted"></p>
<div class="row g-4" id="jobList"></div>
</div>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/jobs.js"></script>
</body>
</html>
